# version: '3.9'

services:
  app:
    build: .
    tty: true
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8080"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  db:
    image: postgres:16
    restart: on-failure
    expose:
      - "6379"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:latest
    restart: on-failure
    expose:
      - "6379"

  celery:
    build: .
    stdin_open: true
    tty: true
    command: celery -A config worker -l info -P eventlet
    restart: on-failure
    volumes:
      - .:/app
    depends_on:
      - db
      - app
      - redis
    env_file:
      - .env

volumes:
  postgres_data:

networks:
  default:
